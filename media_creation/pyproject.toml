[project]
name = "media-director"
version = "0.1.0"
description = "One Loop as a director for personal media: a poster and slide-deck MVP"
authors = [
    { name = "David Xu", email = "aray4702@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
media-director = "media_director.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
