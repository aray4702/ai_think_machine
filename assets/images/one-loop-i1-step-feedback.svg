<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">I.1: plan everything, or commit one step at a time</title>
  <desc id="desc">Left: planning the whole sequence first means searching a tree of b to the n complete sequences (27 at three options and three steps, about 3.5 billion at twenty steps), then executing one path as a script; the world changes partway, so the script goes stale. Right: the closed loop. Choose the next step from b options, conditioned on the goal and a belief state; commit one step to a noisy, changing, partly hidden world; observe what actually happened; update the belief state, a summary of history; repeat. This needs n choices of size b, and a plan or map guides the choice only as a prior, not a script.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#465462"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b54a3a"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#202b35">
    <text x="480" y="36" font-size="23" font-weight="700">Plan Everything, or Commit One Step at a Time</text>

    <!-- Left panel: open loop -->
    <rect x="24" y="64" width="440" height="440" rx="6" fill="#f3f5f7" stroke="#8895a1" stroke-width="2"/>
    <text x="244" y="94" font-size="18" font-weight="700">Plan the whole sequence first</text>
    <g stroke="#aab4be" stroke-width="1.2">
      <line x1="224" y1="128" x2="98" y2="196"/>
      <line x1="224" y1="128" x2="224" y2="196"/>
      <line x1="224" y1="128" x2="350" y2="196"/>
      <line x1="98" y1="196" x2="56" y2="264"/>
      <line x1="98" y1="196" x2="98" y2="264"/>
      <line x1="98" y1="196" x2="140" y2="264"/>
      <line x1="224" y1="196" x2="182" y2="264"/>
      <line x1="224" y1="196" x2="224" y2="264"/>
      <line x1="224" y1="196" x2="266" y2="264"/>
      <line x1="350" y1="196" x2="308" y2="264"/>
      <line x1="350" y1="196" x2="350" y2="264"/>
      <line x1="350" y1="196" x2="392" y2="264"/>
      <line x1="56" y1="264" x2="42" y2="332"/>
      <line x1="56" y1="264" x2="56" y2="332"/>
      <line x1="56" y1="264" x2="70" y2="332"/>
      <line x1="98" y1="264" x2="84" y2="332"/>
      <line x1="98" y1="264" x2="98" y2="332"/>
      <line x1="98" y1="264" x2="112" y2="332"/>
      <line x1="140" y1="264" x2="126" y2="332"/>
      <line x1="140" y1="264" x2="140" y2="332"/>
      <line x1="140" y1="264" x2="154" y2="332"/>
      <line x1="182" y1="264" x2="168" y2="332"/>
      <line x1="182" y1="264" x2="182" y2="332"/>
      <line x1="182" y1="264" x2="196" y2="332"/>
      <line x1="224" y1="264" x2="210" y2="332"/>
      <line x1="224" y1="264" x2="224" y2="332"/>
      <line x1="224" y1="264" x2="238" y2="332"/>
      <line x1="266" y1="264" x2="252" y2="332"/>
      <line x1="266" y1="264" x2="266" y2="332"/>
      <line x1="266" y1="264" x2="280" y2="332"/>
      <line x1="308" y1="264" x2="294" y2="332"/>
      <line x1="308" y1="264" x2="308" y2="332"/>
      <line x1="308" y1="264" x2="322" y2="332"/>
      <line x1="350" y1="264" x2="336" y2="332"/>
      <line x1="350" y1="264" x2="350" y2="332"/>
      <line x1="350" y1="264" x2="364" y2="332"/>
      <line x1="392" y1="264" x2="378" y2="332"/>
      <line x1="392" y1="264" x2="392" y2="332"/>
      <line x1="392" y1="264" x2="406" y2="332"/>
    </g>
    <g fill="#8895a1">
      <circle cx="224" cy="128" r="5"/>
      <circle cx="98" cy="196" r="5"/>
      <circle cx="224" cy="196" r="5"/>
      <circle cx="350" cy="196" r="5"/>
      <circle cx="56" cy="264" r="5"/>
      <circle cx="98" cy="264" r="5"/>
      <circle cx="140" cy="264" r="5"/>
      <circle cx="182" cy="264" r="5"/>
      <circle cx="224" cy="264" r="5"/>
      <circle cx="266" cy="264" r="5"/>
      <circle cx="308" cy="264" r="5"/>
      <circle cx="350" cy="264" r="5"/>
      <circle cx="392" cy="264" r="5"/>
      <circle cx="42" cy="332" r="4"/>
      <circle cx="56" cy="332" r="4"/>
      <circle cx="70" cy="332" r="4"/>
      <circle cx="84" cy="332" r="4"/>
      <circle cx="98" cy="332" r="4"/>
      <circle cx="112" cy="332" r="4"/>
      <circle cx="126" cy="332" r="4"/>
      <circle cx="140" cy="332" r="4"/>
      <circle cx="154" cy="332" r="4"/>
      <circle cx="168" cy="332" r="4"/>
      <circle cx="182" cy="332" r="4"/>
      <circle cx="196" cy="332" r="4"/>
