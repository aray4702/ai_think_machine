      <circle cx="364" cy="332" r="4"/>
      <circle cx="378" cy="332" r="4"/>
      <circle cx="392" cy="332" r="4"/>
      <circle cx="406" cy="332" r="4"/>
    </g>
    <path d="M224 128 L350 196 L350 264" fill="none" stroke="#b54a3a" stroke-width="3"/>
    <path d="M350 264 L350 332" fill="none" stroke="#b54a3a" stroke-width="3" stroke-dasharray="5 4"/>
    <circle cx="224" cy="128" r="6" fill="#b54a3a"/>
    <circle cx="350" cy="196" r="6" fill="#b54a3a"/>
    <circle cx="350" cy="264" r="6" fill="#b54a3a"/>
    <circle cx="350" cy="332" r="6" fill="#b54a3a"/>
    <path d="M341.0 289.0 L359.0 307.0 M359.0 289.0 L341.0 307.0" stroke="#b54a3a" stroke-width="3"/>
    <g font-size="13" font-weight="700" fill="#b54a3a" text-anchor="start" stroke="#f3f5f7" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
      <text x="366.0" y="294.0">world changed:</text>
      <text x="366.0" y="310.0">script is stale</text>
    </g>
    <g font-size="13" fill="#53606c" text-anchor="start">
      <text x="366" y="136">pre-chosen</text>
      <text x="366" y="152">path</text>
    </g>
    <text x="40" y="140" font-size="13" fill="#53606c" text-anchor="start">b = 3 options</text>
    <text x="40" y="156" font-size="13" fill="#53606c" text-anchor="start">per step</text>
    <text x="244" y="370" font-size="15" font-weight="700">bⁿ complete sequences to search</text>
    <text x="244" y="392" font-size="14" fill="#53606c">27 at n = 3; about 3.5 billion at n = 20</text>
    <text x="244" y="448" font-size="14">Search everything, then run one path as a script.</text>
    <text x="244" y="470" font-size="14">The world changes before the script finishes.</text>

    <!-- Right panel: closed loop -->
    <rect x="496" y="64" width="440" height="440" rx="6" fill="#e8f5f1" stroke="#16755d" stroke-width="3"/>
    <text x="716" y="94" font-size="18" font-weight="700" fill="#125c49">Commit one step, observe, update</text>

    <g fill="#ffffff" stroke="#16755d" stroke-width="2">
      <rect x="626" y="128" width="180" height="52" rx="6"/>
      <rect x="790" y="245" width="136" height="70" rx="6" stroke="#8895a1"/>
      <rect x="626" y="380" width="180" height="52" rx="6"/>
      <rect x="506" y="245" width="136" height="70" rx="6"/>
    </g>
    <text x="716" y="150" font-size="15" font-weight="700">Choose next step</text>
    <text x="716" y="169" font-size="13" fill="#53606c">from b options</text>
    <text x="858" y="270" font-size="15" font-weight="700">World</text>
    <text x="858" y="288" font-size="13" fill="#53606c">noisy, changing,</text>
    <text x="858" y="304" font-size="13" fill="#53606c">partly hidden</text>
    <text x="716" y="402" font-size="15" font-weight="700">Observe</text>
    <text x="716" y="421" font-size="13" fill="#53606c">what actually happened</text>
    <text x="574" y="270" font-size="15" font-weight="700">Belief state</text>
    <text x="574" y="288" font-size="13" fill="#53606c">summary of</text>
    <text x="574" y="304" font-size="13" fill="#53606c">history so far</text>

    <circle cx="716" cy="280" r="36" fill="#16755d"/>
    <text x="716" y="285" font-size="15" font-weight="700" fill="#ffffff">Goal</text>
    <path d="M716 243 V183" fill="none" stroke="#16755d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <g fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)">
      <path d="M808 154 Q858 154 858 242"/>
      <path d="M858 318 Q858 406 809 406"/>
      <path d="M624 406 Q574 406 574 318"/>
      <path d="M574 242 Q574 154 623 154"/>
    </g>
    <g font-size="13" font-weight="700">
      <text x="866" y="186" text-anchor="start">commit</text>
      <text x="866" y="202" text-anchor="start">1 step</text>
      <text x="866" y="372" text-anchor="start">outcome</text>
      <text x="566" y="372" text-anchor="end">update</text>
      <text x="566" y="186" text-anchor="end">condition</text>
      <text x="566" y="202" text-anchor="end">on</text>
    </g>

    <text x="716" y="460" font-size="14">n choices of size b, each from a belief built</text>
    <text x="716" y="478" font-size="14">from previous steps. A plan is a prior, not a script.</text>
  </g>
</svg>
