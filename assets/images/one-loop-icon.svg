<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">One Loop</title>
  <desc id="desc">A goal at the center, a dashed reversible inner loop around it, and a solid outer loop of committed steps with an arrow; one step carries its own smaller loop, showing the hierarchy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.8" markerHeight="2.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fca311"/>
    </marker>
    <marker id="arrow-inner" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5ec8d8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#14213d"/>

  <!-- outer loop: irreversible, committed steps -->
  <path d="M128 44 A84 84 0 1 1 74 63.6" fill="none" stroke="#fca311" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- inner loop: reversible simulation / search -->
  <path d="M128 86 A42 42 0 1 1 98.3 98.3" fill="none" stroke="#5ec8d8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9" marker-end="url(#arrow-inner)"/>

  <!-- committed steps -->
  <circle cx="170" cy="200.7" r="9" fill="#fca311" stroke="#14213d" stroke-width="4"/>
  <circle cx="86" cy="200.7" r="9" fill="#fca311" stroke="#14213d" stroke-width="4"/>
  <circle cx="44" cy="128" r="9" fill="#fca311" stroke="#14213d" stroke-width="4"/>

  <!-- one step is itself a loop: the hierarchy -->
  <circle cx="212" cy="128" r="17" fill="#14213d" stroke="#e5e5e5" stroke-width="3.5"/>
  <circle cx="212" cy="128" r="6" fill="#fca311"/>

  <!-- goal -->
  <circle cx="128" cy="128" r="11" fill="none" stroke="#e5e5e5" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="4.5" fill="#e5e5e5"/>
</svg>
