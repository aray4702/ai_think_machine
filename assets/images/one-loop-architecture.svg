<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc">
  <title id="title">One Loop architecture</title>
  <desc id="desc">During a session: controller K tracks process signals (progress, uncertainty, info gain, budget, surprise, predicted error, permission gap, beauty) and chooses control actions (run skill, think, recall, backtrack, switch, ask, incubate, commit, stop). It sets the mode of generator G and gates writes to working state W and procedural store P. Input from the user, tools or environment is source-tagged, enters context C and reaches generator G, which perceives, recalls, simulates and acts. G reads and writes the protected working state W: the goal stack with TOTE tests, the belief, the plan and the permission envelope. G simulates in scratch, a forkable inner loop discarded after use; its output passes the action gate, which checks grants and reversibility class, before reaching the world. Between sessions: the salience-tagged episodic log E feeds sleep, which selects episodes, replays them in reverse, extracts gist into M, generates counterfactuals and distills. Only trusted, verified experience passes the consolidation gate into the weights θ and new skills in P.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#465462"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16755d"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b54a3a"/>
    </marker>
  </defs>
  <rect width="960" height="704" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#202b35">
    <text x="480" y="36" font-size="23" font-weight="700">One Loop Architecture</text>

    <!-- During a session -->
    <rect x="24" y="56" width="912" height="384" rx="6" fill="#f3f5f7" stroke="#8895a1" stroke-width="2"/>
    <text x="40" y="82" font-size="12" font-weight="700" fill="#53606c" letter-spacing="1" text-anchor="start">DURING A SESSION</text>

    <!-- Controller K -->
    <rect x="330" y="72" width="592" height="110" rx="6" fill="#202b35"/>
    <text x="626" y="96" font-size="15" font-weight="700" fill="#ffffff">CONTROLLER K</text>
    <text x="626" y="118" font-size="12" fill="#ffffff">signals: progress · uncertainty · info gain · budget · surprise ·</text>
    <text x="626" y="134" font-size="12" fill="#ffffff">predicted error · permission gap · beauty</text>
    <text x="626" y="154" font-size="12" fill="#ffffff">actions: RUN SKILL · THINK · RECALL · BACKTRACK · SWITCH ·</text>
    <text x="626" y="170" font-size="12" fill="#ffffff">ASK · INCUBATE · COMMIT · STOP</text>

    <g transform="translate(0 36)">

    <path d="M415 146 V208" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="423" y="182" font-size="11" fill="#53606c" text-anchor="start">mode</text>
    <path d="M630 146 V208" fill="none" stroke="#b54a3a" stroke-width="2" marker-end="url(#arrow-r)"/>
    <text x="638" y="182" font-size="11" fill="#b54a3a" text-anchor="start">gate</text>
    <path d="M832 146 V198" fill="none" stroke="#b54a3a" stroke-width="2" marker-end="url(#arrow-r)"/>
    <text x="840" y="177" font-size="11" fill="#b54a3a" text-anchor="start">gate</text>

    <!-- Input and source tag -->
    <rect x="32" y="226" width="120" height="48" rx="24" fill="#ffffff" stroke="#465462" stroke-width="2"/>
    <text x="92" y="246" font-size="14" font-weight="700">input</text>
    <text x="92" y="264" font-size="11" fill="#53606c">user · tool · env</text>
    <path d="M152 250 H166" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="168" y="234" width="104" height="32" rx="16" fill="#465462"/>
    <text x="220" y="254" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">SOURCE TAG</text>
    <path d="M272 250 H328" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 266 V316" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Generator G -->
    <rect x="330" y="210" width="170" height="80" rx="6" fill="#e8f5f1" stroke="#16755d" stroke-width="2"/>
    <text x="415" y="236" font-size="14" font-weight="700" fill="#125c49">GENERATOR G</text>
    <text x="415" y="256" font-size="12">perceive · recall ·</text>
    <text x="415" y="274" font-size="12">simulate · act</text>

    <path d="M502 250 H538" fill="none" stroke="#16755d" stroke-width="2" marker-start="url(#arrow-g)" marker-end="url(#arrow-g)"/>

    <!-- Working state W -->
    <rect x="540" y="210" width="180" height="80" rx="6" fill="#e8f5f1" stroke="#16755d" stroke-width="3"/>
    <text x="630" y="232" font-size="14" font-weight="700" fill="#125c49">WORKING STATE W</text>
    <text x="630" y="250" font-size="12">goal stack (TOTE) · belief</text>
    <text x="630" y="266" font-size="12">plan · permissions</text>
    <text x="630" y="282" font-size="11" fill="#53606c">(protected)</text>

    <!-- Procedural store P -->
    <rect x="742" y="200" width="180" height="100" rx="6" fill="#ffffff" stroke="#465462" stroke-width="2"/>
    <text x="832" y="224" font-size="14" font-weight="700">PROCEDURAL STORE P</text>
    <text x="832" y="244" font-size="12">skills: trigger · body ·</text>
    <text x="832" y="262" font-size="12">inverse · invariants ·</text>
    <text x="832" y="280" font-size="12">forward model · reliability</text>

    <!-- Context C -->
    <rect x="140" y="318" width="160" height="66" rx="6" fill="#ffffff" stroke="#8895a1" stroke-width="2"/>
    <text x="220" y="345" font-size="14" font-weight="700">CONTEXT C</text>
    <text x="220" y="365" font-size="12">recent, source-tagged</text>

    <!-- Scratch -->
    <path d="M415 290 V316" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="318" width="180" height="66" rx="6" fill="#ffffff" stroke="#8895a1" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="415" y="340" font-size="14" font-weight="700">SCRATCH</text>
    <text x="415" y="358" font-size="12">forkable inner loop;</text>
    <text x="415" y="375" font-size="12">discarded after use</text>

    <!-- Action gate and world -->
    <path d="M505 351 H554" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M572 320 H728 L744 351 L728 382 H572 L556 351 Z" fill="#f6e3df" stroke="#b54a3a" stroke-width="2"/>
    <text x="650" y="342" font-size="13" font-weight="700" fill="#b54a3a">ACTION GATE</text>
    <text x="650" y="359" font-size="12">grants</text>
    <text x="650" y="375" font-size="12">reversibility class</text>
    <path d="M744 351 H778" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="780" y="331" width="120" height="40" rx="20" fill="#202b35"/>
    <text x="840" y="356" font-size="14" font-weight="700" fill="#ffffff">world</text>

    <!-- Between sessions -->
    <rect x="24" y="420" width="912" height="228" rx="6" fill="#f3f5f7" stroke="#8895a1" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="40" y="446" font-size="12" font-weight="700" fill="#53606c" letter-spacing="1" text-anchor="start">BETWEEN SESSIONS</text>

    <rect x="40" y="480" width="130" height="60" rx="6" fill="#ffffff" stroke="#465462" stroke-width="2"/>
    <text x="105" y="505" font-size="13" font-weight="700">EPISODIC LOG E</text>
    <text x="105" y="524" font-size="12" fill="#53606c">salience-tagged</text>

    <!-- Sleep -->
    <rect x="200" y="462" width="440" height="154" rx="6" fill="#ffffff" stroke="#8895a1" stroke-width="2"/>
    <text x="216" y="484" font-size="13" font-weight="700" text-anchor="start">SLEEP</text>
    <path d="M170 510 H214" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="12">
      <rect x="216" y="494" width="70" height="32" rx="16" fill="#e8f5f1" stroke="#16755d" stroke-width="1.5"/>
      <text x="251" y="514">select</text>
      <path d="M286 510 H314" fill="none" stroke="#465462" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="316" y="494" width="112" height="32" rx="16" fill="#e8f5f1" stroke="#16755d" stroke-width="1.5"/>
      <text x="372" y="514">reverse replay</text>
      <path d="M428 510 H456" fill="none" stroke="#465462" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="458" y="494" width="56" height="32" rx="16" fill="#e8f5f1" stroke="#16755d" stroke-width="1.5"/>
      <text x="486" y="514">gist</text>
      <path d="M514 510 H542" fill="none" stroke="#465462" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="544" y="494" width="56" height="32" rx="6" fill="#ffffff" stroke="#465462" stroke-width="2"/>
      <text x="572" y="515" font-size="14" font-weight="700">M</text>
      <path d="M572 526 V543 H469 V558" fill="none" stroke="#465462" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="410" y="560" width="118" height="32" rx="16" fill="#e8f5f1" stroke="#16755d" stroke-width="1.5"/>
      <text x="469" y="580">counterfactuals</text>
      <path d="M528 576 H550" fill="none" stroke="#465462" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="552" y="560" width="72" height="32" rx="16" fill="#e8f5f1" stroke="#16755d" stroke-width="1.5"/>
      <text x="588" y="580">distill</text>
    </g>
    <path d="M624 576 H654" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Consolidation gate and outputs -->
    <path d="M672 544 H792 L808 576 L792 608 H672 L656 576 Z" fill="#f6e3df" stroke="#b54a3a" stroke-width="2"/>
    <text x="732" y="572" font-size="11" font-weight="700" fill="#b54a3a">CONSOLIDATION</text>
    <text x="732" y="586" font-size="11" font-weight="700" fill="#b54a3a">GATE</text>
    <text x="732" y="600" font-size="10" fill="#53606c">trusted, verified only</text>
    <path d="M808 576 H816 V546 H826" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M816 576 V606 H826" fill="none" stroke="#465462" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="828" y="526" width="100" height="40" rx="6" fill="#ffffff" stroke="#465462" stroke-width="2"/>
    <text x="878" y="551" font-size="12" font-weight="700">θ (weights)</text>
    <rect x="828" y="586" width="100" height="40" rx="6" fill="#ffffff" stroke="#465462" stroke-width="2"/>
    <text x="878" y="611" font-size="12" font-weight="700">new skills in P</text>
    </g>
  </g>
</svg>
